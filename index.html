<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daily Habit Tracker - Track your habits, build streaks, and achieve your goals with beautiful gamification">
    <meta name="theme-color" content="#0a0e27">
    <title>Daily Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="min-h-screen bg-background text-foreground">
        <!-- Hero Section -->
        <div id="heroSection" class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">Daily Habit Tracker</h1>
                <p class="hero-subtitle">Simple. Streak Counter. Works Offline.</p>
                <button id="getStartedBtn" class="cta-button">+ Get Started</button>
            </div>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <div class="login-container">
                <div class="login-header">
                    <h1 class="login-title">Daily Habit Tracker</h1>
                    <p class="login-subtitle">Track your habits. Build your streaks. Achieve your goals.</p>
                </div>

                <div class="login-form-wrapper">
                    <div id="loginForm" class="login-form">
                        <h2 class="form-title">Welcome Back</h2>
                        <form id="loginFormElement" class="form-group-vertical">
                            <div class="form-group">
                                <label for="loginEmail">Email</label>
                                <input type="email" id="loginEmail" placeholder="your@email.com" required>
                            </div>
                            <div class="form-group">
                                <label for="loginPassword">Password</label>
                                <input type="password" id="loginPassword" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn-login">Sign In</button>
                        </form>
                        <div class="form-divider">or</div>
                        <button id="signupToggleBtn" class="btn-signup-toggle">Create New Account</button>
                    </div>

                    <div id="signupForm" class="login-form hidden">
                        <h2 class="form-title">Create Account</h2>
                        <form id="signupFormElement" class="form-group-vertical">
                            <div class="form-group">
                                <label for="signupName">Full Name</label>
                                <input type="text" id="signupName" placeholder="John Doe" required>
                            </div>
                            <div class="form-group">
                                <label for="signupEmail">Email</label>
                                <input type="email" id="signupEmail" placeholder="your@email.com" required>
                            </div>
                            <div class="form-group">
                                <label for="signupPassword">Password</label>
                                <input type="password" id="signupPassword" placeholder="••••••••" required>
                            </div>
                            <div class="form-group">
                                <label for="signupConfirmPassword">Confirm Password</label>
                                <input type="password" id="signupConfirmPassword" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn-login">Create Account</button>
                        </form>
                        <div class="form-divider">or</div>
                        <button id="loginToggleBtn" class="btn-signup-toggle">Sign In Instead</button>
                    </div>
                </div>
            </div>
        </div>




    </div>



    <script src="script.js"></script>
</body>
</html>
